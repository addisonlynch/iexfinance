name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  secure: ""

jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: true
      matrix:
        include:
          - python-version: "3.8"
            PANDAS: "0.23"
            NUMPY: "1.13"
          - python-version: "3.6"
            PANDAS: "MASTER"
            NUMPY: "1.14"
          - python-version: "3.7"
            PANDAS: "MASTER"
            NUMPY: "1.17"
          - python-version: "3.8"
            PANDAS: "MASTER"
            DOCBUILD: "true"
            NUMPY: "1.18"
    env:
      PANDAS: ${{ matrix.PANDAS }}
      NUMPY: ${{ matrix.NUMPY }}
      DOCBUILD: ${{ matrix.DOCBUILD }}
      TRAVIS_PYTHON_VERSION: ${{ matrix.python-version }}
      TRAVIS_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: source ci/pypi-install.sh
      - run: pip list
      - run: python setup.py install
      - run: coverage run setup.py pytest
      - run: |
          if (( $(echo "$TRAVIS_PYTHON_VERSION > 3.5" | bc -l))); then
          black --version; black --check iexfinance
          fi
      - run: flake8 --version
      - run: flake8 iexfinance
      - run: |
          if [[ $DOCBUILD ]]; then
            flake8-rst --version
            flake8-rst --filename="*.rst"
            set -e
            cd docs
            make html
            cd ..
            doctr deploy devel --build-tags
            if [[ -z ${TRAVIS_TAG} ]]; then
              echo "Not a tagged build."
            else
              doctr deploy stable --build-tags
            fi
          fi
      - run: codecov --token='f4d1c94d-2af2-49c9-aebd-4e009c8a6266'
        if: always()